<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Choice - 声なき選択</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-color: #4CAF50;
            --danger-color: #e53935;
            --info-color: #2196F3;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            /* フェードインアニメーション */
            animation: fadeIn 0.8s ease-out;
            border: 1px solid #333;
        }

        /* アニメーション定義 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 2px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
            color: #fff;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
            text-align: left;
            color: #ccc;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--card-color);
            color: #fff;
            border: 1px solid #555;
            padding: 20px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-align: left;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans JP', sans-serif;
        }

        button:hover {
            background-color: #333;
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
        }

        button::after {
            content: '>';
            position: absolute;
            right: 20px;
            opacity: 0.5;
        }

        /* 特定のボタンスタイル */
        button.search-btn {
            border-color: var(--info-color);
            color: var(--info-color);
        }
        button.search-btn:hover {
            background-color: rgba(33, 150, 243, 0.1);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.2);
        }

        /* 政策ボックスのスタイル */
        .policy-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }
        .policy-title {
            font-weight: bold;
            color: #ffd700;
            font-size: 1.1em;
            margin-bottom: 5px;
            display: block;
        }

        /* 結果表示のスタイル */
        .result-box {
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-color);
        }
        .good { color: #81c995; font-weight: bold; }
        .bad { color: #f28b82; font-weight: bold; }
        
        /* グラフエリア（今は仮） */
        .chart-placeholder {
            height: 200px;
            background: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<div class="container" id="game-container">
    </div>

<script>
    // --- シナリオデータ ---
    const scenes = {
        intro: {
            title: "Silent Choice",
            text: "ようこそ。<br>ここはあなたの「選択」の重さを測るシミュレーターです。<br><br>これからの数分間、あなたは日常の小さな場面から国家の命運まで、様々な選択を迫られます。<br>準備はいいですか？",
            buttons: [
                { text: "体験を始める", next: "stage1" }
            ]
        },
        stage1: {
            title: "Stage 1：意見表明",
            text: "あなたは4人家族のお父さんです。<br>今、家族会議で「次の旅行先」を決めています。<br><br>母：「絶対買い物に行きたいわ！」<br>祖父：「わしは温泉がいいのぉ」<br>娘：「遊園地じゃなきゃヤダ！」<br><br>あなたは心の中で<b>「キャンプに行きたい」</b>と思っています。<br>しかし、母の声が大きく、このままだと「買い物」に決まりそうです。",
            buttons: [
                { text: "黙って見ている", next: "stage1_fail" },
                { text: "カードを出す（意見を言う）", next: "stage1_success" }
            ]
        },
        stage1_fail: {
            title: "結果：沈黙",
            text: "あなたは黙っていました。<br>結局、お母さんの意見が通り「買い物」に決まりました。<br><br>あなたの「キャンプに行きたい」という願いは、誰にも知られることなく消えました。<br><b>教訓：沈黙は、現状への肯定（YES）と同じです。</b>",
            buttons: [{ text: "次のステージへ", next: "stage2" }]
        },
        stage1_success: {
            title: "結果：変化",
            text: "「実はキャンプに行きたいんだ」と勇気を出して言いました。<br>家族は驚きましたが、「パパが言うなら…たまにはいいかもね」と議論のテーブルに乗りました。<br><br><b>教訓：意見は発信しない限り、選択肢にすらなりません。</b>",
            buttons: [{ text: "次のステージへ", next: "stage2" }]
        },
        stage2: {
            title: "Stage 2：情報収集",
            text: "今日の夕食を決めるため、母からLINEで候補が送られてきました。<br>写真はありません。<br><br><b>A：ヤンソンさんの誘惑</b>（響きがカッコイイ！）<br><b>B：ピッティパンナ</b>（響きがカワイイ！）<br><br>どっちにする？",
            buttons: [
                { text: "A（ヤンソンさんの誘惑）にする", next: "stage2_bad_a" },
                { text: "B（ピッティパンナ）にする", next: "stage2_bad_b" },
                { text: "スマホで検索する", next: "stage2_search", class: "search-btn" }
            ]
        },
        stage2_bad_a: {
            title: "結果：イメージとのギャップ",
            text: "カッコイイ名前に惹かれてAを選びました。<br>出てきたのは<b>「アンチョビ（塩辛い小魚）たっぷりのグラタン」</b>でした。<br>あなたは魚の生臭さが苦手だったので、少し後悔しました。<br><br><b>教訓：中身を知らずに選ぶのは、ギャンブルと同じです。</b>",
            buttons: [{ text: "次のステージへ", next: "stage3" }]
        },
        stage2_bad_b: {
            title: "結果：イメージとのギャップ",
            text: "可愛い名前に惹かれてBを選びました。<br>スイーツかと思いきや、出てきたのは<b>「ジャガイモと肉の炒め物」</b>でした。<br>美味しいですが、甘いものが食べたかったのでガッカリしました。<br><br><b>教訓：耳障りの良い言葉には、裏があるかもしれません。</b>",
            buttons: [{ text: "次のステージへ", next: "stage3" }]
        },
        stage2_search: {
            title: "検索結果",
            text: "スマホで調べました。<br><br><b>A：ヤンソンさんの誘惑</b><br>→ スウェーデンの伝統料理。アンチョビとポテトのグラタン。<br><br><b>B：ピッティパンナ</b><br>→ スウェーデンの家庭料理。残り物のポテト炒め。<br><br>中身がわかりました。どちらにしますか？",
            buttons: [
                { text: "アンチョビは苦手だからBにする", next: "stage2_good" },
                { text: "グラタンが好きだからAにする", next: "stage2_good" }
            ]
        },
        stage2_good: {
            title: "結果：納得の選択",
            text: "自分の好みに合った料理を選べました！<br>知っていたおかげで、失敗せずに済みました。<br><br><b>教訓：情報は武器です。知ることで、初めて自分のための選択ができます。</b>",
            buttons: [{ text: "次のステージへ", next: "stage3" }]
        },
        stage3: {
            title: "Stage 3：行動と変革",
            text: "あなたの学校のトイレは、廊下から中が丸見えです。<br>みんな「恥ずかしい」「嫌だ」と思っています。<br>あなたはどうしますか？",
            buttons: [
                { text: "友達に文句を言う", next: "stage3_fail" },
                { text: "我慢して使う", next: "stage3_fail" },
                { text: "生徒会に意見書を出す", next: "stage3_success" }
            ]
        },
        stage3_fail: {
            title: "結果：現状維持",
            text: "文句を言ったり我慢したりしましたが、<br>結局、卒業するまでトイレは丸見えのままでした。<br>何も変わりませんでした。<br><br><b>教訓：不満を口にするだけでは、世界は1ミリも変わりません。</b>",
            buttons: [{ text: "メッセージへ", next: "review" }]
        },
        stage3_success: {
            title: "結果：変革",
            text: "あなたは勇気を出して意見書を出しました。<br>それを見た先生たちが動き、翌月には目隠しのパーティションが設置されました！<br><br><b>教訓：ルールを変えるのは、具体的な「行動」だけです。</b>",
            buttons: [{ text: "メッセージへ", next: "review" }]
        },
        review: {
            title: "私たちのメッセージ",
            text: `
                <div style="text-align:left; padding:10px;">
                政治とは、遠いニュースの話ではありません。<br>
                今日の晩ごはんや、学校のトイレを決めるプロセスのことです。<br><br>
                声を上げなければ、無視される。<br>
                知ろうとしなければ、誘導される。<br>
                行動しなければ、変わらない。<br><br>
                さあ、準備はいいですか？<br>
                <b>あなたは今から、ある国の未来を決めます。</b>
                </div>`,
            buttons: [
                { text: "投票会場へ進む", next: "final_vote" }
            ]
        },
        final_vote: {
            title: "Final Stage：歴史の選択",
            text: "あなたは架空の国「アトラス共和国」の国民です。<br>今年、国の予算が<b>「10兆円」</b>余りました。<br>3人の候補者が使い道を提案しています。誰にこの国の未来を託しますか？",
            buttons: [
                { 
                    html: "<span class='policy-title'>候補者A：今を豊かに</span>国民全員に100万円給付！今の生活を楽に。",
                    next: "result_a" 
                },
                { 
                    html: "<span class='policy-title'>候補者B：未来へ投資</span>学費完全無料！10年後の最強国家へ。",
                    next: "result_b" 
                },
                { 
                    html: "<span class='policy-title'>候補者C：鉄壁の守り</span>軍事と防災を強化。命を最優先に守る。",
                    next: "result_c" 
                }
            ]
        },
        result_a: {
            title: "あなたが選んだ未来：A",
            text: `
                <div class="result-box">
                    <h3>結果：国中がお祭り騒ぎに！</h3>
                    <p><span class="good">【光】</span>みんな欲しかった物が買えて笑顔に。</p>
                    <p><span class="bad">【影】</span>しかし翌年、お金は尽き生活は元通り。何も残らず国は衰退しました。</p>
                    <hr>
                    <p><b>学び：あなたは「現在」を選び、「未来」を食いつぶしました。</b></p>
                </div>`,
            buttons: [{ text: "みんなの投票結果を見る", next: "chart_view" }]
        },
        result_b: {
            title: "あなたが選んだ未来：B",
            text: `
                <div class="result-box">
                    <h3>結果：若者が天才的な発明を！</h3>
                    <p><span class="good">【光】</span>10年後、新しい産業が生まれ世界一豊かな国に。</p>
                    <p><span class="bad">【影】</span>しかし、その間に貧困層は見捨てられ、暴動が起きました。</p>
                    <hr>
                    <p><b>学び：あなたは「未来」のために、「現在」の弱者を切り捨てました。</b></p>
                </div>`,
            buttons: [{ text: "みんなの投票結果を見る", next: "chart_view" }]
        },
        result_c: {
            title: "あなたが選んだ未来：C",
            text: `
                <div class="result-box">
                    <h3>結果：犯罪も被害もゼロ！</h3>
                    <p><span class="good">【光】</span>大災害が起きても死者ゼロ。治安も最高。</p>
                    <p><span class="bad">【影】</span>しかし街は監視カメラだらけ。自由な発言は許されません。</p>
                    <hr>
                    <p><b>学び：あなたは「安全」のために、「自由」を差し出しました。</b></p>
                </div>`,
            buttons: [{ text: "みんなの投票結果を見る", next: "chart_view" }]
        },
        chart_view: {
            title: "投票結果",
            text: "（ここにリアルタイムのグラフが表示されます）<br><br>正解はありません。しかし、選ばなければ勝手に決まってしまいます。<br>あなたの現実（リアル）の一票を、大切に。",
            buttons: [
                { text: "タイトルに戻る", next: "intro" }
            ]
        }
    };

    function showScene(sceneKey) {
        const container = document.getElementById('game-container');
        const scene = scenes[sceneKey];
        
        // アニメーションのリセット（フェードインを毎回させるため）
        container.style.animation = 'none';
        container.offsetHeight; /* trigger reflow */
        container.style.animation = 'fadeIn 0.5s ease-out';

        let html = `<h1>${scene.title}</h1>`;
        html += `<p>${scene.text}</p>`;
        
        // グラフ画面の場合の特別処理（今はプレースホルダー）
        if(sceneKey === 'chart_view') {
            html += `<div class="chart-placeholder">Graph Area</div>`;
        }

        html += `<div class="btn-group">`;
        scene.buttons.forEach(btn => {
            const label = btn.html ? btn.html : btn.text;
            const className = btn.class ? btn.class : '';
            html += `<button class="${className}" onclick="showScene('${btn.next}')">${label}</button>`;
        });
        html += `</div>`;
        
        container.innerHTML = html;
        window.scrollTo(0, 0);
    }

    showScene('intro');
</script>

</body>
</html>
